name: Build Mad Minute APK
on:
  push:
    # index.html-only changes don't need a new APK; the app downloads them itself.
    paths: ['mad-minute/**', '!mad-minute/app/src/main/assets/**', '!**.md', '.github/workflows/mad-minute-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mad-minute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-34 build-tools;34.0.0' }
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: MadMinute-apk, path: mad-minute/app/build/outputs/apk/debug/app-debug.apk }
      # Stable download link for the phone:
      # https://github.com/devsenweb/domain-name-generator-app/releases/download/mad-minute-latest/MadMinute.apk
      - name: Publish to the mad-minute-latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MadMinute.apk
          gh release delete mad-minute-latest --yes --cleanup-tag || true
          gh release create mad-minute-latest MadMinute.apk --target "$GITHUB_SHA" --prerelease \
            --title "Mad Minute (latest build)" --notes "Open on the Android phone and tap MadMinute.apk to install."
