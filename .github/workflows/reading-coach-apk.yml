name: Build Reading Coach APK
on:
  push:
    # index.html-only changes don't need a new APK; the app downloads them itself.
    paths: ['reading-coach/**', '!reading-coach/app/src/main/assets/**', '!**.md', '.github/workflows/reading-coach-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reading-coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-34 build-tools;34.0.0' }
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ReadingCoach-apk, path: reading-coach/app/build/outputs/apk/debug/app-debug.apk }
      # Stable download link for the phone:
      # https://github.com/devsenweb/domain-name-generator-app/releases/download/reading-coach-latest/ReadingCoach.apk
      - name: Publish to the reading-coach-latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ReadingCoach.apk
          gh release delete reading-coach-latest --yes --cleanup-tag || true
          gh release create reading-coach-latest ReadingCoach.apk --target "$GITHUB_SHA" --prerelease \
            --title "Reading Coach (latest build)" --notes "Open on the Android phone and tap ReadingCoach.apk to install."
