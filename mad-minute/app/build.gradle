plugins {
    id 'com.android.application'
}

// Each CI run gets a higher versionCode so a new APK installs over the old one.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.madminute.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.madminute.app'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"

        // The app fetches this file on every launch, so the UI can be updated
        // by pushing a new index.html without reinstalling the APK.
        buildConfigField "String", "UPDATE_URL",
                "\"https://raw.githubusercontent.com/devsenweb/domain-name-generator-app/main/mad-minute/app/src/main/assets/index.html\""
    }

    buildFeatures {
        buildConfig true
    }

    // Fixed key, committed on purpose: every APK must be signed with the same
    // key or Android refuses to install it over the previous one.
    signingConfigs {
        release {
            storeFile file('madminute.keystore')
            storePassword 'madminute'
            keyAlias 'madminute'
            keyPassword 'madminute'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
